<!DOCTYPE html>
<html>

<head>
    <title>Menghitung Nilai</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
        }

        .card {
            width: 400px;
            background: white;
            padding: 20px;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        span {
            color: red;
        }

        .header-main {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            padding: 15px;
        }

        .btn-default {
            background-color: #12497c;
            color: #ffffff;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 4px;
        }

        .input-control {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <header class="header-main">
        <h3>Program untuk Menghitung Nilai Minimum, Maksimum, dan Rata-rata</h3>
    </header>

    <div class="card">
        <label for="angka">Masukkan Angka<span>*</span></label>
        <input type="text" id="angka" class="input-control" placeholder="Masukkan Angka" step="5" >

        <button id="btnMulai" class="btn-default">Mulai</button>
    </div>
    <script src="T3_067.js"></script>

</body>
